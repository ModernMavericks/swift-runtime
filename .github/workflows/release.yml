name: release

# Build libswiftCore FROM SOURCE for OS X 10.9 / x86_64 on a macOS 26 runner, build the Sparkle
# updater, package the runtime .pkg (with the updater), sign it, and attach the .pkg + signed
# appcast to a GitHub Release. Tags ARE the version -- no `v` prefix; see VERSION.
#
# The host build environment (swiftlang LLVM build support + the swift.org toolchain) is NOT built
# here: it is fetched, SHA-verified, from ModernMavericks/swift-toolchain. See build.sh.
#
# RELEASE GATING: CI proves the build succeeds and the compat guard passes -- necessary hygiene, but
# a macOS 26 runner is structurally blind to the 10.9-only behaviour this runtime exists to fix (it
# needs six source patches for exactly that reason). ACCEPTANCE is manual real-10.9 validation:
# install the .pkg on real 10.9.5 and run it. This runtime was validated 500/500 + Guard Malloc /
# MallocScribble there. Do not treat CI green as acceptance.
# (The automated self-test bundle + 10.9 gate were dropped this release; the hand-rolled self-test
# linked Increment-1 siblings the core .pkg doesn't ship. They return rebuilt to match the .pkg.)

on:
  push:
    branches: ['**']          # regular build on every push -- surfaces breaks off the release path
    tags: ['*-mavericks.*']   # tags ARE the version, no `v` prefix (see VERSION)
  workflow_dispatch:

permissions:
  contents: write

# Each tag is a unique ref, so a publish is never cancelled by a later one -- and must not be: two
# publishes racing the same tag is a corrupt release, not a flaky build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # assert_appcast_upgradeable.sh orders this release against prior tags

      # shared-cmake installs itself via its own action (HTTPS via the runner token); consumed thereafter
      # via find_package(MavericksSharedCMake) + the installed ${MavericksSharedCMake_SCRIPTS}.
      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1

      # The shared runner takes the whole top-level suite, so a newly added test runs the day it
      # lands. run-selftest.sh needs the runtime installed on a real 10.9 box, so here it exits 77
      # and is reported SKIP rather than failing a run that was never going to have one.
      - name: Run the repo's tests
        run: sh "$MSC_SCRIPTS/run-repo-tests.sh"

      - name: Version check (tag must equal VERSION)
        id: ver
        run: |
          VER=$(cat VERSION); echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != $VER (VERSION file)"; exit 1
          fi

      - name: Ensure Rosetta (x86_64 self-tests run under it)
        run: softwareupdate --install-rosetta --agree-to-license || true

      # No cache step here, deliberately. The host build environment is fetched and SHA-verified
      # per run from ModernMavericks/swift-toolchain, so a cold run and a warm run produce the
      # same result. The previous cache keyed on hashFiles('build.sh') with no path component;
      # when this repo was renamed the checkout path moved, the stale entry was restored anyway,
      # and its CMake build tree pointed LLVM_CMAKE_DIR at a directory that no longer existed.
      # Re-keying would have left correctness depending on cache state; removing the dependency
      # is the fix.
      - name: Build libswiftCore (from source, 10.9 / x86_64; env from swift-toolchain)
        run: ./build.sh

      - name: Compat guard (must pass)
        run: ./scripts/guard.sh out/usr/lib/swift/*.dylib

      - name: Build SwiftUpdater.app (Cocoa/Sparkle; must NOT link Swift)
        run: |
          # The Sparkle framework is fetched inside mavericks_add_updater_app (mavericks_fetch_sparkle).
          cmake -S . -B build/updater -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          cmake --build build/updater --target SwiftUpdater
          otool -L build/updater/SwiftUpdater.app/Contents/MacOS/SwiftUpdater | tee /tmp/o.txt
          ! grep -q '/usr/lib/swift' /tmp/o.txt || { echo "::error::updater links libswiftCore (self-update circularity)"; exit 1; }

      - name: Package runtime .pkg (10.9.5 floor; stages the updater + shim + LaunchAgent)
        run: ./package.sh

      - name: Sign the .pkg + generate the Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          SH="$MSC_SCRIPTS"   # exported by install@v1; don't re-derive it from the registry
          [ -d "$SH" ] || { echo "::error::MSC_SCRIPTS not set by install@v1"; exit 1; }
          VER=$(cat VERSION)
          PKG=$(ls dist/swift-runtime-*.pkg | head -1)
          # The tag IS the version, so the download path carries no `v`.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")"
          # sign_and_appcast.sh auto-fetches the prebuilt ed25519-sign, signs the pkg, and renders the appcast.
          sh "$SH/sign_and_appcast.sh" \
            --channel-title "Mavericks Swift Runtime" --version "$VER" \
            --pkg-url "$URL" --notes-file "release-notes/$VER.md" --pkg "$PKG" --min-os 10.9.5 \
            > dist/appcast.xml
          echo "=== appcast.xml ==="; cat dist/appcast.xml

      # NOTE: the self-test bundle is intentionally dropped from this release. The hand-rolled
      # thorough_test linked Increment-1 siblings (libswiftObjectiveC/Darwin) not shipped in the
      # core .pkg, so it only "passed" where those were already installed -- a mirage. It returns
      # in a later release, rebuilt to match exactly what the .pkg ships. Acceptance for this
      # release is the manual real-10.9 validation (500/500 + Guard Malloc/Scribble).

      # The body travels IN the artifact: publish-release.yml does not check out the repo. Until now
      # this repo published with NO body at all -- its publish step set no body_path.
      - name: Stage the release notes
        run: |
          set -eu
          VER="$(cat VERSION)"
          mkdir -p dist
          if [ -s "release-notes/$VER.md" ]; then
            cp "release-notes/$VER.md" dist/RELEASE_NOTES.md
          else
            printf '## %s\n\nlibswiftCore built from source for OS X 10.9 / x86_64.\n' "$VER" > dist/RELEASE_NOTES.md
          fi

      # Conformance: do the artifacts about to be published agree with each other and with the
      # family's schemes? Gated on a tag, which is when this repo publishes -- a plain push builds
      # without producing the appcast this asks about.
      - name: Artifact conformance
        if: github.ref_type == 'tag'
        run: |
          sh "$MSC_SCRIPTS/artifact-facts.sh" dist "${{ steps.ver.outputs.version }}" \
            | sh "$MSC_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate: a client on the previous release must SEE this as an upgrade -- a numeric
          # sparkle:version that orders strictly after the last published one (ordering conformance
          # never exercised; the gap the "-mavericks.N compares EQUAL" bug shipped through).
          sh "$MSC_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/appcast.xml --version "${{ steps.ver.outputs.version }}"

      # No SHA256SUMS in the artifact: publish-release.yml regenerates it over everything it attaches.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: swift-runtime
          path: |
            dist/*.pkg
            dist/appcast.xml
            dist/RELEASE_NOTES.md

  publish:
    needs: [build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ModernMavericks/shared-cmake/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: swift-runtime

  # The real-10.9 self-test acceptance job is removed with the self-test bundle. Acceptance for this
  # release is manual (install the .pkg on real 10.9; the runtime was validated 500/500 + Guard
  # Malloc/Scribble). An automated 10.9 gate returns when the self-tests are rebuilt to match the .pkg.
